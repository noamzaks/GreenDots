[project]
name = "greendots"
version = "0.3.0"
description = "The files GreenDots runs are made of: typed models of plans, status streams and logs, and their layout"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.11", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.9"
venvPath = ".."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["src/greendots"]
